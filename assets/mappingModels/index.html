<!DOCTYPE html>
<html lang="en">
<head>
<script>
window.onerror=function(msg,src,line,col,err){window.parent.postMessage({type:'app-error',message:msg,source:src,lineno:line,colno:col,stack:err&&err.stack||''},'*');};
window.onunhandledrejection=function(e){window.parent.postMessage({type:'app-error',message:'Unhandled promise rejection: '+(e.reason&&e.reason.message||e.reason||'unknown'),stack:e.reason&&e.reason.stack||''},'*');};
window.addEventListener('error',function(e){var t=e&&e.target;if(t&&t!==window&&t.tagName==='SCRIPT'){var u=t.src||'';window.parent.postMessage({type:'app-error',message:'Failed to load script'+(u?': '+u:' (inline module)'),source:u},'*');}},true);
(function(){var _f=window.fetch;window.fetch=function(){var a=arguments,u=typeof a[0]==='string'?a[0]:(a[0]&&a[0].url)||'';var p=_f.apply(this,a);p.then(function(r){if(r.status===500){r.clone().text().then(function(b){window.parent.postMessage({type:'fetch-error',url:u,status:500,body:b},'*');}).catch(function(){window.parent.postMessage({type:'fetch-error',url:u,status:500,body:''},'*');});}}).catch(function(e){window.parent.postMessage({type:'fetch-error',url:u,status:0,body:e.message||'fetch failed'},'*');});return p;};})();
</script>
<script src="https://builder.puter.com/runtime.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey Mapper — Visual survey data migration</title>
<meta name="description" content="Load two survey domain models and visually map questions and response options to plan data migration between systems.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'ui-monospace', 'monospace'] } } } };
</script>
<script src="https://js.puter.com/v2/"></script>
<link rel="stylesheet" href="styles.css">
    <!-- puter-pwa: generated, do not edit -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Survey">
    <!-- /puter-pwa -->
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans antialiased">
<div id="app" class="h-[100dvh] flex flex-col">

  <!-- Top bar -->
  <header class="h-14 shrink-0 bg-white border-b border-zinc-200 flex items-center gap-2 px-3 sm:px-4">
    <div class="flex items-center gap-2.5 min-w-0">
      <img src="icon.svg" alt="" class="w-7 h-7 shrink-0">
      <div class="min-w-0 hidden sm:block">
        <input id="projectName" class="name-input text-sm font-semibold bg-transparent rounded-md px-1.5 py-0.5 -ml-1.5 w-56 truncate" value="Untitled mapping" aria-label="Mapping name">
        <div id="saveStatus" class="text-[11px] text-zinc-400 px-0.5 leading-none -mt-0.5">Not saved</div>
      </div>
    </div>

    <div class="mx-auto seg" role="tablist">
      <button data-view="map" class="seg-btn" aria-selected="true"><i data-lucide="waypoints" class="w-4 h-4"></i><span class="hidden sm:inline">Map</span></button>
      <button data-view="table" class="seg-btn"><i data-lucide="table-2" class="w-4 h-4"></i><span class="hidden sm:inline">Migration table</span></button>
    </div>

    <div class="flex items-center gap-1">
      <button id="undoBtn" class="icon-btn hidden md:inline-flex" title="Undo (Ctrl+Z)"><i data-lucide="undo-2" class="w-4 h-4"></i></button>
      <button id="redoBtn" class="icon-btn hidden md:inline-flex" title="Redo (Ctrl+Shift+Z)"><i data-lucide="redo-2" class="w-4 h-4"></i></button>
      <div class="w-px h-6 bg-zinc-200 mx-1 hidden md:block"></div>
      <button id="suggestBtn" class="btn hidden lg:inline-flex"><i data-lucide="sparkles" class="w-4 h-4"></i>Suggest links</button>
      <button id="exportBtn" class="btn btn-primary"><i data-lucide="download" class="w-4 h-4"></i><span class="hidden sm:inline">Export</span></button>
      <button id="moreBtn" class="icon-btn" title="More"><i data-lucide="ellipsis-vertical" class="w-4 h-4"></i></button>
      <button id="accountBtn" class="ml-1 h-8 rounded-full border border-zinc-200 px-2.5 text-xs font-medium text-zinc-700 hover:bg-zinc-50 inline-flex items-center gap-1.5"><i data-lucide="log-in" class="w-3.5 h-3.5"></i><span>Sign in</span></button>
    </div>
  </header>

  <!-- Stats strip -->
  <div id="stats" class="shrink-0 bg-white border-b border-zinc-200 px-3 sm:px-4 h-10 flex items-center gap-5 text-xs text-zinc-500 overflow-x-auto no-scrollbar"></div>

  <!-- Mobile pane switch -->
  <div id="mobileTabs" class="md:hidden shrink-0 bg-white border-b border-zinc-200 px-3 py-2 flex gap-2">
    <button data-pane="src" class="seg-btn flex-1 justify-center border border-zinc-200 rounded-lg" aria-selected="true">Source</button>
    <button data-pane="tgt" class="seg-btn flex-1 justify-center border border-zinc-200 rounded-lg">Target</button>
  </div>

  <main class="flex-1 min-h-0 flex relative">
    <!-- Map view -->
    <section id="mapView" class="flex-1 min-w-0 flex relative">
      <div id="mapArea" class="flex-1 min-w-0 flex relative">
        <div class="panel flex-1 min-w-0 flex flex-col" data-side="src" id="srcPanel"></div>
        <div id="gutter" class="hidden md:block w-[120px] lg:w-[150px] shrink-0"></div>
        <div class="panel flex-1 min-w-0 flex flex-col" data-side="tgt" id="tgtPanel"></div>
        <svg id="wires" class="hidden md:block absolute inset-0 w-full h-full pointer-events-none overflow-visible"></svg>
      </div>
      <aside id="inspector" class="inspector hidden"></aside>
    </section>

    <!-- Table view -->
    <section id="tableView" class="flex-1 min-w-0 flex-col hidden"></section>
  </main>
</div>

<div id="toasts" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[80] flex flex-col items-center gap-2 pointer-events-none"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
